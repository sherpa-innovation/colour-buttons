# Written by SHERPA from the repository's config; change it through SHERPA.
# It runs exactly the platform's gate.
name: sdlc-checks
'on':
  pull_request: {}
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.13'
    - name: 'install: python -m pip install ruff pytest'
      run: python -m pip install ruff pytest
      working-directory: .
    - name: python -m ruff check .
      run: python -m ruff check .
    - name: python -m pytest -q
      run: python -m pytest -q
